name: Apply Start Experience cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("start-experience.html")
          s = p.read_text(encoding="utf-8-sig")
          old = 'placeholder="3282733326"'
          assert old in s, "phone placeholder not found"
          s = s.replace(old, 'placeholder="Numero di telefono"', 1)
          start = s.index('        <p class="booking-success-wa" hidden>')
          end = s.index('        </p>', start) + len('        </p>')
          s = s[:start] + s[end:]
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add start-experience.html
          git commit -m "Clean up Start Experience confirmation"
          git push origin HEAD:main
