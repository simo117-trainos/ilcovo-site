name: Fix mobile menu CSS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-mobile-menu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CSS fix and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/styles.css')
          text = css_path.read_text(encoding='utf-8-sig')
          old = '''  nav#nav.site-header .nav-links,
  .hyrox-page nav#nav.site-header .nav-links,
  .cf-page nav#nav.site-header .nav-links {
    left:50%;
    right:auto;
    width:min(calc(100vw - 40px),1680px);
    transform:translateX(-50%) translateY(-10px);
  }

  nav#nav.site-header.nav-open .nav-links {
    transform:translateX(-50%);
  }
'''
          new = '''  nav#nav.site-header .nav-links,
  .hyrox-page nav#nav.site-header .nav-links,
  .cf-page nav#nav.site-header .nav-links {
    left:auto;
    right:20px;
    width:min(calc(100vw - 40px),1680px);
    max-width:calc(100vw - 40px);
    box-sizing:border-box;
    transform:translateY(-10px);
  }

  nav#nav.site-header.nav-open .nav-links,
  .hyrox-page nav#nav.site-header.nav-open .nav-links,
  .cf-page nav#nav.site-header.nav-open .nav-links {
    transform:translateY(0);
  }
'''
          if old not in text:
              raise SystemExit('Expected mobile menu CSS block not found')
          css_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          pages = [
            'index.html','crossfit.html','hyrox.html','orari.html','prezzi.html',
            'prenota-prova.html','privacy-policy.html','cookie-policy.html','attrezzature.html'
          ]
          for page in pages:
              p = Path(page)
              if not p.exists():
                  continue
              html = p.read_text(encoding='utf-8-sig')
              html = html.replace('href="assets/css/styles.css"', 'href="assets/css/styles.css?v=20260807-menu-fix"')
              html = html.replace('src="assets/js/header.js"', 'src="assets/js/header.js?v=20260807-menu-fix"')
              p.write_text(html, encoding='utf-8')
          PY

      - name: Validate
        run: |
          git diff --check
          grep -q 'right:20px;' assets/css/styles.css
          grep -q 'max-width:calc(100vw - 40px);' assets/css/styles.css
          grep -q 'styles.css?v=20260807-menu-fix' index.html
          grep -q 'header.js?v=20260807-menu-fix' index.html

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css index.html crossfit.html hyrox.html orari.html prezzi.html prenota-prova.html privacy-policy.html cookie-policy.html attrezzature.html
          git rm .github/workflows/fix-mobile-menu-css.yml
          git commit -m "Fix mobile menu layout and refresh assets"
          git push origin HEAD:main
